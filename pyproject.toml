[project]
name = "jtalm"
version = "0.1.0"
description = "Tiny Japanese language models that run on an ESP32-S3: an Action LM for M5Stack Stack-chan (K151)"
readme = "README.md"
authors = [{ name = "ayutaz" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["japanese", "tiny-llm", "function-calling", "esp32", "microcontroller", "robotics", "stack-chan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=2.0.0",
    "jsonschema>=4.26.0",
    "openai>=3.20.0",
]

[project.urls]
Homepage = "https://github.com/ayutaz/JapaneseTinyAgentLM"
Repository = "https://github.com/ayutaz/JapaneseTinyAgentLM"
Issues = "https://github.com/ayutaz/JapaneseTinyAgentLM/issues"
Model = "https://huggingface.co/ayousanz/JapaneseTinyAgentLM-Action-3M"
Dataset = "https://huggingface.co/datasets/japanese-data-analyze/JapaneseTinyAgentLM-Action-Synth"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

# PyTorch: CPU wheels on macOS, CUDA 12.6 wheels on Linux and Windows.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long Japanese prompt / dataset-card strings: wrapping would change the text.
"src/jtalm/data/prompts.py" = ["E501"]
"src/jtalm/data/publish.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
train = [
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
]
