name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.20"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run --only-dev ruff check src tests firmware/tools
      - run: uv run --only-dev ruff format --check src tests firmware/tools

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --group train
      # includes the C runtime parity test (gcc is on the runner)
      - run: uv run --group train pytest -q

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make -C runtime/host
      # the same sources as a CMake library (the ESP-IDF component path is built by the firmware)
      - run: cmake -S runtime/host -B runtime/host/build/cmake && cmake --build runtime/host/build/cmake
